<!DOCTYPE html>
<html lang="zh-CN" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="format-detection" content="date=no" />
  <meta name="format-detection" content="telephone=no" />
  <title>{{title}}</title>
</head>
<body style="margin: 0; padding: 0; background: {{primaryColorLight}}; font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: none;">
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background: {{primaryColorLight}};">
    <tbody>
      <tr>
        <td align="center" style="padding: 48px 20px;">
          <table role="presentation" width="560" border="0" cellspacing="0" cellpadding="0" style="background: #ffffff; border-radius: 12px; overflow: hidden;">
            <tbody>
              <tr>
                <td align="left" style="padding: 40px 40px 0 40px;">
                  <img src="{{fullLogoUrl}}" width="210" alt="{{tenantName}}" style="display: block; max-width: 100%;" />
                </td>
              </tr>
              <tr>
                <td align="left" style="padding: 32px 40px 0 40px; font-size: 24px; line-height: 32px; font-weight: 600; color: #0a0a0a;">
                  {{title}}
                </td>
              </tr>
              <tr>
                <td align="left" style="padding: 16px 40px 0 40px; font-size: 15px; line-height: 24px; color: #2f2e2e; white-space: pre-line; word-break: break-word;">
                  {{body}}
                </td>
              </tr>
              {{#link}}
              <tr>
                <td align="left" style="padding: 28px 40px 0 40px;">
                  <table role="presentation" border="0" cellspacing="0" cellpadding="0">
                    <tbody>
                      <tr>
                        <td align="left" style="background: {{primaryColor}}; border-radius: 8px;">
                          <a href="{{link}}" target="_blank" style="display: block; padding: 12px 18px; font-size: 15px; font-weight: 500; color: #ffffff; text-decoration: none;">
                            查看问题
                          </a>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </td>
              </tr>
              {{/link}}
              <tr>
                <td style="padding: 24px 40px 32px 40px;">
                  {{> footer}}
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
