services:
  nginx:
    image: nginx:1.25
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      bench:
        # Static IP so the SANDBOX_PROCESS engine (whose sandbox /etc/resolv.conf points at public
        # DNS 8.8.8.8 and can't resolve the docker-internal "nginx" name) can still reach the server
        # by IP to report flow results. FEMA_FRONTEND_URL points here.
        ipv4_address: 172.30.0.10

  app:
    image: activepieces-benchmark:local
    build: .
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    environment:
      FEMA_CONTAINER_TYPE: APP
      FEMA_POSTGRES_DATABASE: activepieces
      FEMA_POSTGRES_PASSWORD: password
      FEMA_POSTGRES_USERNAME: postgres
      FEMA_POSTGRES_HOST: postgres
      FEMA_POSTGRES_PORT: 5432
      FEMA_JWT_SECRET: benchmark-secret-key-for-testing
      FEMA_ENCRYPTION_KEY: 11020ebf480a9b1648ceec6400beaf26
      FEMA_FRONTEND_URL: http://172.30.0.10:80
      FEMA_EXECUTION_MODE: ${FEMA_EXECUTION_MODE:-SANDBOX_CODE_ONLY}
      FEMA_REDIS_HOST: redis
      FEMA_REDIS_PORT: 6379
      FEMA_ENVIRONMENT: prod
      FEMA_LOG_LEVEL: error
      FEMA_TELEMETRY_ENABLED: false
      FEMA_PROJECT_RATE_LIMITER_ENABLED: false
      FEMA_SANDBOX_MEMORY_LIMIT: ${FEMA_SANDBOX_MEMORY_LIMIT:-}
      FEMA_DEFAULT_CONCURRENT_JOBS_LIMIT: 1000
      FEMA_FILE_STORAGE_LOCATION: ${FEMA_FILE_STORAGE_LOCATION:-DB}
      FEMA_S3_BUCKET: ${FEMA_S3_BUCKET:-}
      FEMA_S3_ACCESS_KEY_ID: ${FEMA_S3_ACCESS_KEY_ID:-}
      FEMA_S3_SECRET_ACCESS_KEY: ${FEMA_S3_SECRET_ACCESS_KEY:-}
      FEMA_S3_ENDPOINT: ${FEMA_S3_ENDPOINT:-}
      FEMA_S3_REGION: ${FEMA_S3_REGION:-}
      FEMA_S3_USE_SIGNED_URLS: ${FEMA_S3_USE_SIGNED_URLS:-false}
    deploy:
      replicas: ${APP_REPLICAS:-1}
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - bench

  worker:
    image: activepieces-benchmark:local
    depends_on:
      - app
    environment:
      FEMA_CONTAINER_TYPE: WORKER
      FEMA_FRONTEND_URL: http://172.30.0.10:80
      FEMA_JWT_SECRET: benchmark-secret-key-for-testing
      FEMA_ENCRYPTION_KEY: 11020ebf480a9b1648ceec6400beaf26
      FEMA_EXECUTION_MODE: ${FEMA_EXECUTION_MODE:-SANDBOX_CODE_ONLY}
      FEMA_REDIS_HOST: redis
      FEMA_REDIS_PORT: 6379
      FEMA_POSTGRES_DATABASE: activepieces
      FEMA_POSTGRES_PASSWORD: password
      FEMA_POSTGRES_USERNAME: postgres
      FEMA_POSTGRES_HOST: postgres
      FEMA_POSTGRES_PORT: 5432
      FEMA_LOG_LEVEL: error
      FEMA_TELEMETRY_ENABLED: false
      FEMA_WORKER_CONCURRENCY: ${FEMA_WORKER_CONCURRENCY:-}
      FEMA_FILE_STORAGE_LOCATION: ${FEMA_FILE_STORAGE_LOCATION:-DB}
      FEMA_S3_BUCKET: ${FEMA_S3_BUCKET:-}
      FEMA_S3_ACCESS_KEY_ID: ${FEMA_S3_ACCESS_KEY_ID:-}
      FEMA_S3_SECRET_ACCESS_KEY: ${FEMA_S3_SECRET_ACCESS_KEY:-}
      FEMA_S3_ENDPOINT: ${FEMA_S3_ENDPOINT:-}
      FEMA_S3_REGION: ${FEMA_S3_REGION:-}
      FEMA_S3_USE_SIGNED_URLS: ${FEMA_S3_USE_SIGNED_URLS:-false}
    privileged: true
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      - bench

  postgres:
    image: postgres:14.4
    environment:
      POSTGRES_DB: activepieces
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bench

  redis:
    image: redis:7.0.7
    networks:
      - bench

volumes:
  postgres_data:

networks:
  bench:
    ipam:
      config:
        - subnet: 172.30.0.0/16
