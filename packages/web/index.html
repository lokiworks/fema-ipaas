<!-- Keep title and favicon in one line, so the github actions remove them correctly -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <base href="/" />
  <title><%= apTitle %></title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png">
  <link rel="icon" type="image/x-icon" href="<%= apFavicon %>">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('fema.theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || ((!stored || stored === 'system') && prefersDark)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#151515';
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (error) {
        return;
      }
    })();
  </script>
  <link rel="stylesheet" href="/src/styles.css" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
