# Default values for fema.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/lokiworks/fema-ipaas
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Container configuration
container:
  port: 80

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /v1/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

persistence:
  enabled: true
  size: 2Gi
  mountPath: "/usr/src/app/cache"

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# ============================================================================
# Bitnami PostgreSQL subchart (optional)
# Set enabled=true to deploy a bundled PostgreSQL instance.
# When enabled, add these vars to femaEnvVariables and ensure they
# are present in fema-secrets:
#   FEMA_DB_TYPE=POSTGRES
#   FEMA_POSTGRES_HOST=<release-name>-postgresql
#   FEMA_POSTGRES_PORT=5432
#   FEMA_POSTGRES_DATABASE=fema
#   FEMA_POSTGRES_USERNAME=postgres
#   FEMA_POSTGRES_PASSWORD=<auto-generated or set auth.password below>
# Full subchart options: https://artifacthub.io/packages/helm/bitnami/postgresql
# ============================================================================
postgresql:
  enabled: false
  # auth:
  #   database: fema
  #   username: postgres
  #   password: ""        # leave empty to auto-generate
  # primary:
  #   persistence:
  #     enabled: true
  #     size: 8Gi

# ============================================================================
# Bitnami Redis subchart (optional)
# Set enabled=true to deploy a bundled Redis instance.
# When enabled, add these vars to femaEnvVariables and ensure they
# are present in fema-secrets:
#   FEMA_REDIS_TYPE=DEFAULT
#   FEMA_REDIS_HOST=<release-name>-redis-master
#   FEMA_REDIS_PORT=6379
#   FEMA_REDIS_PASSWORD=<auto-generated or set auth.password below>
# Full subchart options: https://artifacthub.io/packages/helm/bitnami/redis
# ============================================================================
redis:
  enabled: false
  # auth:
  #   enabled: true
  #   password: ""        # leave empty to auto-generate
  # master:
  #   persistence:
  #     enabled: true
  #     size: 4Gi

# Deployment-specific, non-sensitive env vars set as plain values.
# Use this for vars that differ per release (e.g. APP vs WORKER) and don't belong in the shared secret.
femaConfig:
  FEMA_CONTAINER_TYPE: ""

# Map of Kubernetes secret name → list of AP_* (and OTEL_*) env var names to inject.
# Each var name must exist as a key in the corresponding secret.
# Populate secrets with deploy/scripts/apply-secrets.sh --secret-name <name> before deploying.
femaEnvVariables:
  fema-config-secrets:
    - FEMA_EXECUTION_MODE
    - FEMA_ENVIRONMENT
    - FEMA_FRONTEND_URL
    - FEMA_ENABLE_WORKFLOW_ON_PUBLISH
    - FEMA_CLIENT_REAL_IP_HEADER
    - FEMA_DB_TYPE
    - FEMA_ENGINE_EXECUTABLE_PATH
    - FEMA_PLATFORM_ID_FOR_DEDICATED_WORKER
    - FEMA_CONNECTORS_SYNC_MODE
    - FEMA_CONNECTORS_SOURCE
  fema-auth-secrets:
    - FEMA_ENCRYPTION_KEY
    - FEMA_JWT_SECRET
    - FEMA_API_KEY
    - FEMA_WORKER_TOKEN
    - FEMA_GOOGLE_CLIENT_ID
    - FEMA_GOOGLE_CLIENT_SECRET
    - FEMA_FIREBASE_HASH_PARAMETERS
  fema-queue-secrets:
    - FEMA_QUEUE_UI_ENABLED
    - FEMA_QUEUE_UI_USERNAME
    - FEMA_QUEUE_UI_PASSWORD
  fema-log-secrets:
    - FEMA_LOG_LEVEL
    - FEMA_LOG_PRETTY
    - FEMA_SENTRY_DSN
    - FEMA_HYPERDX_TOKEN
  fema-telemetry-secrets:
    - FEMA_TELEMETRY_ENABLED
    - FEMA_OTEL_ENABLED
    - FEMA_FEATUREBASE_API_KEY
  fema-limits-secrets:
    - FEMA_DEFAULT_CONCURRENT_JOBS_LIMIT
    - FEMA_PROJECT_RATE_LIMITER_ENABLED
    - FEMA_API_RATE_LIMIT_AUTHN_ENABLED
    - FEMA_MAX_FILE_SIZE_MB
    - FEMA_MAX_EXECUTION_LOG_SIZE_MB
    - FEMA_EXECUTION_DATA_RETENTION_DAYS
    - FEMA_WEBHOOK_TIMEOUT_SECONDS
  fema-cloudflare-secrets:
    - FEMA_CLOUDFLARE_API_BASE
    - FEMA_CLOUDFLARE_ZONE_ID
    - FEMA_CLOUDFLARE_API_TOKEN
  fema-integrations-secrets:
    - FEMA_APP_WEBHOOK_SECRETS
    - FEMA_SECRET_MANAGER_API_KEY
    - FEMA_OPENROUTER_PROVISION_KEY
    - FEMA_TEMPLATES_API_KEY
    - FEMA_TEMPLATE_MANAGER_API_KEY
  fema-db-secrets:
    - FEMA_POSTGRES_DATABASE
    - FEMA_POSTGRES_HOST
    - FEMA_POSTGRES_PORT
    - FEMA_POSTGRES_PASSWORD
    - FEMA_POSTGRES_USERNAME
    - FEMA_POSTGRES_USE_SSL
    - FEMA_POSTGRES_POOL_SIZE
    - FEMA_POSTGRES_SSL_CA
  fema-redis-secrets:
    - FEMA_REDIS_TYPE
    - FEMA_REDIS_HOST
    - FEMA_REDIS_PORT
    - FEMA_REDIS_PASSWORD
    - FEMA_REDIS_USE_SSL
    - FEMA_REDIS_USER
  fema-s3-secrets:
    - FEMA_FILE_STORAGE_LOCATION
    - FEMA_S3_BUCKET
    - FEMA_S3_REGION
    - FEMA_S3_ENDPOINT
    - FEMA_S3_USE_SIGNED_URLS
    - FEMA_S3_ACCESS_KEY_ID
    - FEMA_S3_SECRET_ACCESS_KEY
  fema-smtp-secrets:
    - FEMA_SMTP_HOST
    - FEMA_SMTP_PORT
    - FEMA_SMTP_USERNAME
    - FEMA_SMTP_PASSWORD
    - FEMA_SMTP_SENDER_EMAIL
    - FEMA_SMTP_SENDER_NAME
  fema-stripe-secrets:
    - FEMA_STRIPE_SECRET_KEY
    - FEMA_STRIPE_WEBHOOK_SECRET
  fema-otel-secrets:
    - OTEL_EXPORTER_OTLP_ENDPOINT
    - OTEL_EXPORTER_OTLP_HEADERS
