name: Release Connectors

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/connectors/**'
      - 'packages/core/shared/**'

concurrency:
  group: release-connectors
  cancel-in-progress: false

jobs:
  Release-Connectors:
    if: github.repository == 'lokiworks/fema-ipaas'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: bun-

      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: copy project .npmrc to user level
        run: cp .npmrc $HOME/.npmrc

      # @fema-ipaas/shared, connectors-common and connectors-framework are no longer published to npm:
      # connectors are now self-contained bundles that inline these dependencies at build time.

      - name: Find changed connectors
        id: changed
        run: |
          OUTPUT=$(npx ts-node -r tsconfig-paths/register -P packages/server/engine/tsconfig.lib.json tools/scripts/connectors/find-changed-connectors.ts)

          TURBO_FILTER=$(echo "$OUTPUT" | grep '^TURBO_FILTER:' | sed 's/^TURBO_FILTER://')
          CHANGED_DIRS=$(echo "$OUTPUT" | sed -n '/^CHANGED_DIRS:$/,/^TURBO_FILTER:/{ /^CHANGED_DIRS:$/d; /^TURBO_FILTER:/d; p; }')

          if [ -z "$TURBO_FILTER" ]; then
            echo "No changed connectors found"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "turbo_filter=$TURBO_FILTER" >> "$GITHUB_OUTPUT"
            {
              echo "changed_dirs<<CONNECTORS_EOF"
              echo "$CHANGED_DIRS"
              echo "CONNECTORS_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Changed connectors: $TURBO_FILTER"
          fi

      - name: Build changed connectors
        if: steps.changed.outputs.has_changes == 'true'
        run: npx turbo run build ${{ steps.changed.outputs.turbo_filter }} --force

      - name: publish connectors packages
        if: steps.changed.outputs.has_changes == 'true'
        run: npx ts-node -r tsconfig-paths/register -P packages/server/engine/tsconfig.lib.json tools/scripts/connectors/publish-connectors-to-npm.ts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CHANGED_CONNECTORS: ${{ steps.changed.outputs.changed_dirs }}

      - name: Check available memory
        run: free -h

      - name: update connectors metadata
        if: steps.changed.outputs.has_changes == 'true'
        run: npx ts-node -r tsconfig-paths/register -P packages/server/engine/tsconfig.lib.json tools/scripts/connectors/update-connectors-metadata.ts packages/connectors/sdk
        env:
          FEMA_CLOUD_API_KEY: ${{ secrets.FEMA_CLOUD_API_KEY }}
          NODE_OPTIONS: "--max-old-space-size=8192"
          CHANGED_CONNECTORS: ${{ steps.changed.outputs.changed_dirs }}

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"🚨 **Release Connectors Workflow Failed** 🚨\\n\\n**Repository:** ${{ github.repository }}\\n**Branch:** ${{ github.ref_name }}\\n**Commit:** ${{ github.sha }}\\n**Action URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\\n\\nThe release connectors workflow has failed. Please check the logs for more details.\"}" \
            ${{ secrets.DISCORD_ON_CALL_WEBHOOK }}
