name: CI
on:
  pull_request:

permissions:
  actions: read
  contents: read


jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.repository == 'lokiworks/fema-ipaas'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install

      - name: Turbo Cache
        uses: rharkor/caching-for-turbo@v2.4.2
        with:
          provider: s3
          s3-bucket: ${{ secrets.TURBO_CACHE_S3_BUCKET }}
          s3-region: auto
          s3-endpoint: ${{ secrets.TURBO_CACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ secrets.TURBO_CACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.TURBO_CACHE_S3_SECRET_ACCESS_KEY }}
          max-age: 3w
          max-size: 20gb

      - name: Check if framework or common connectors are changed
        id: check-framework-common
        run: |
          CHANGED_FILES="$(git diff --name-only HEAD origin/main | tr '\n' ' ')"
          if echo "$CHANGED_FILES" | grep -q "connectors/sdk\|connectors/common"; then
            echo "framework_or_common_changed=true" >> $GITHUB_OUTPUT
          else
            echo "framework_or_common_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Lint core projects
        run: npm run lint-core

      - name: Lint all connectors projects
        if: steps.check-framework-common.outputs.framework_or_common_changed == 'true'
        run: npm run lint-connectors

  main:
    runs-on: ubuntu-latest
    if: github.repository == 'lokiworks/fema-ipaas'
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:14.4
        env:
          POSTGRES_DB: fema
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: A79Vm5D4p2VQHOp2gd5
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7.0.7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install

      - name: Turbo Cache
        uses: rharkor/caching-for-turbo@v2.4.2
        with:
          provider: s3
          s3-bucket: ${{ secrets.TURBO_CACHE_S3_BUCKET }}
          s3-region: auto
          s3-endpoint: ${{ secrets.TURBO_CACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ secrets.TURBO_CACHE_S3_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.TURBO_CACHE_S3_SECRET_ACCESS_KEY }}
          max-age: 3w
          max-size: 20gb

      - name: Get changed files
        id: changed-files
        run: echo "files=$(git diff --name-only HEAD origin/main | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Check if framework or common connectors are changed
        id: check-framework-common
        run: |
          CHANGED_FILES="${{ steps.changed-files.outputs.files }}"
          if echo "$CHANGED_FILES" | grep -q "connectors/sdk\|connectors/common"; then
            echo "framework_or_common_changed=true" >> $GITHUB_OUTPUT
          else
            echo "framework_or_common_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract connectors package names from changed files
        id: extract-connectors
        run: |
          CONNECTORS=$(echo "${{ steps.changed-files.outputs.files }}" | grep -oE "packages/connectors/(community|core)/[^/]+" | awk -F'/' '{print $NF}' | sort -u | tr '\n' ',' | sed 's/,$//')
          if [ -n "$CONNECTORS" ]; then
            FILTERS=$(echo "$CONNECTORS" | tr ',' '\n' | sed 's/.*/{&}/' | tr '\n' ',' | sed 's/,$//')
            echo "connectors_filters=$FILTERS" >> $GITHUB_OUTPUT
          else
            echo "connectors_filters=" >> $GITHUB_OUTPUT
          fi

      - name: Build core projects
        run: npx turbo run build --filter=web --filter=worker --filter=api --filter=@fema-ipaas/engine --filter=@fema-ipaas/connector-http --filter=@fema-ipaas/connector-data-mapper --filter=@fema-ipaas/connector-webhook

      - name: Build changed connectors projects
        if: steps.extract-connectors.outputs.connectors_filters != '' && steps.check-framework-common.outputs.framework_or_common_changed == 'false'
        run: |
          IFS=',' read -ra CONNECTORS <<< "${{ steps.extract-connectors.outputs.connectors_filters }}"
          FILTER_ARGS=""
          for connector in "${CONNECTORS[@]}"; do
            connector_name=$(echo "$connector" | tr -d '{}')
            if [ -f "packages/connectors/community/${connector_name}/package.json" ] || [ -f "packages/connectors/core/${connector_name}/package.json" ]; then
              FILTER_ARGS="$FILTER_ARGS --filter=@fema-ipaas/connector-${connector_name}"
            fi
          done
          if [ -n "$FILTER_ARGS" ]; then
            npx turbo run build $FILTER_ARGS
          fi

      - name: Build all connectors projects
        if: steps.check-framework-common.outputs.framework_or_common_changed == 'true'
        run: npx turbo run build --filter='@fema-ipaas/connector-*'

      - name: Run unit tests
        run: npm run test-unit

      - name: Check migrations
        run: |
          set -euo pipefail
          npx turbo run check-migrations --filter=api
          npx tsx tools/scripts/check-migration-rollback.ts

      - name: Run API integration tests
        working-directory: packages/server/api
        run: |
          set -a; . ./.env.tests; set +a
          npx vitest run test/integration --bail 1 --passWithNoTests=false \
            --exclude 'test/integration/security/**' \
            --exclude 'test/integration/solution/solution.test.ts'

      - name: Run API security and solution integration tests one file at a time
        working-directory: packages/server/api
        run: |
          set -a; . ./.env.tests; set +a
          status=0
          for f in test/integration/security/*.test.ts test/integration/security/deep/*.test.ts test/integration/solution/solution.test.ts; do
            echo "::group::$f"
            if ! npx vitest run "$f" --passWithNoTests=false; then
              echo "::error file=packages/server/api/$f::integration test file failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
